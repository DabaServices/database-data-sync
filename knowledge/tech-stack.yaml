stack:
  runtime: Node 24, ESM, TypeScript strict (NodeNext), built with tsc to dist/
  database: PostgreSQL via pg + pg-copy-streams (COPY streaming)
  validation: zod (environment variables)
  testing: Vitest (node environment), fake databases, no real DB in unit tests
  deployment: Docker image run by a Kubernetes/OpenShift CronJob (k8s/cronjob.yaml)
  tooling: pnpm, ESLint flat config, Prettier
gotchas:
  - Relative imports must end in .ts; tsc rewrites them to .js on build.
  - SYNC_TABLES must list tables in load order (referenced tables first); the job fails if it is empty, malformed or has duplicates.
